name: Deploy FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Vérifier les secrets FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          missing=0
          for key in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Secret manquant: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          case "$FTP_SERVER" in
            *://*|*/*|*\\*)
              echo "::error::FTP_SERVER doit être un nom d'hôte ou une IP, sans ftp:// ni chemin."
              exit 1
              ;;
          esac
          echo "FTP_SERVER OK (format)"
          echo "FTP_SERVER_DIR=$FTP_SERVER_DIR"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github*/**
            **/node_modules/**
            **/*.log
            **/.env
            **/.htaccess
